services:
  - type: web
    name: tracenet-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: EMBEDDING_MODEL_NAME
        value: all-MiniLM-L6-v2
      - key: LOW_MEMORY_MODE
        value: "true"
      - key: PYTHON_VERSION
        value: 3.11.0
